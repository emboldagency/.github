name: WordPress Plugin Release Reusable Workflow

on:
  workflow_call:
    inputs:
      plugin_slug:
        description: 'The slug of the plugin (e.g. embold-tailwind-blocks)'
        required: true
        type: string
      main_file:
        description: 'The main PHP file of the plugin (e.g. embold-tailwind-blocks.php)'
        required: true
        type: string

jobs:
  # Callers trigger on every tag so that a tag this workflow won't release is
  # reported here, instead of never running and leaving a release with no zip.
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check the tag is a release version
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          # A manual run on a branch is a dev build, not a release.
          if [ "$REF_TYPE" != "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$TAG" =~ ^[vV]([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            BARE="${BASH_REMATCH[1]}"
            echo "::error::Plugin releases are tagged without a v prefix ($BARE, not $TAG). No release zip was built."
            {
              echo "## \`$TAG\` was not released"
              echo
              echo "WordPress plugin tags have no \`v\` prefix, so this workflow builds \`$BARE\`, not \`$TAG\`."
              echo
              echo "**If a GitHub release exists on \`$TAG\`**, move it to the bare tag at the same commit:"
              echo
              echo '```bash'
              echo "git fetch --tags"
              echo "gh release edit $TAG --tag $BARE --target \$(git rev-parse '$TAG^{commit}')"
              echo "git push origin :refs/tags/$TAG"
              echo "gh workflow run release.yml --ref $BARE   # only if no zip was attached"
              echo '```'
              echo
              echo "**If there is no release yet**, replace the tag and this workflow creates the release:"
              echo
              echo '```bash'
              echo "git fetch --tags"
              echo "git tag $BARE '$TAG^{commit}'"
              echo "git push origin $BARE :refs/tags/$TAG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::notice::$TAG is not a version tag, so no release was built. If it was meant to be one, tag it as 1.2.3 or 1.2.3-beta.1."
          echo "build=false" >> "$GITHUB_OUTPUT"

  dist:
    needs: check-tag
    if: needs.check-tag.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout central tooling
        uses: actions/checkout@v4
        with:
          repository: emboldagency/.github
          path: .github-internal

      - name: Prepare scripts
        run: |
          mkdir -p /tmp/embold-scripts
          cp -r .github-internal/scripts/* /tmp/embold-scripts/
          rm -rf .github-internal
          chmod +x /tmp/embold-scripts/*.sh

      - name: Set up PHP with Composer and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp-cli

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dist-archive command
        run: |
          rm -f ~/.composer/auth.json ~/.config/composer/auth.json && unset COMPOSER_AUTH
          wp package install wp-cli/dist-archive-command:v3.1.0 --allow-root

      # build.sh --fix stamps the tag's version into the zip either way; this
      # only flags that the repo's own files say otherwise.
      - name: Check the plugin files match the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          MAIN_FILE: ${{ inputs.main_file }}
        run: |
          HEADER=$(grep -E -o "Version: *[0-9A-Za-z.-]+" "$MAIN_FILE" | head -n1 | sed -E "s/Version: *//")
          STABLE=$(grep -E -o "Stable tag: *[0-9A-Za-z.-]+" readme.txt 2>/dev/null | head -n1 | sed -E "s/Stable tag: *//" || true)

          for pair in "$MAIN_FILE Version:$HEADER" "readme.txt Stable tag:$STABLE"; do
            FILE="${pair%% *}"
            FOUND="${pair##*:}"
            if [ -n "$FOUND" ] && [ "$FOUND" != "$TAG" ]; then
              echo "::warning file=$FILE::$FILE says $FOUND but the tag is $TAG. The zip was built as $TAG; bump $FILE in the next release so the repo agrees."
            fi
          done

      - name: Build distribution archive
        env:
          GIT_TAG: ${{ github.ref_name }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          MAIN_FILE: ${{ inputs.main_file }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            rm -f ~/.composer/auth.json ~/.config/composer/auth.json && unset COMPOSER_AUTH
            bash /tmp/embold-scripts/build.sh --fix
          else
            rm -f ~/.composer/auth.json ~/.config/composer/auth.json && unset COMPOSER_AUTH
            bash /tmp/embold-scripts/build.sh --dev
          fi

      - name: Assemble release metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          bash /tmp/embold-scripts/release-meta.sh
          echo "--- release notes ---"
          cat "$NOTES_FILE"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: ${{ steps.meta.outputs.generated == 'true' }}
          files: dist/archives/*
