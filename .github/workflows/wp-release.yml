name: WordPress Plugin Release Reusable Workflow

on:
  workflow_call:
    inputs:
      plugin_slug:
        description: 'The slug of the plugin (e.g. embold-tailwind-blocks)'
        required: true
        type: string
      main_file:
        description: 'The main PHP file of the plugin (e.g. embold-tailwind-blocks.php)'
        required: true
        type: string

jobs:
  dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout central tooling
        uses: actions/checkout@v4
        with:
          repository: emboldagency/.github
          path: .github-internal

      - name: Prepare scripts
        run: |
          mkdir -p /tmp/embold-scripts
          cp -r .github-internal/scripts/* /tmp/embold-scripts/
          rm -rf .github-internal
          chmod +x /tmp/embold-scripts/*.sh

      - name: Set up PHP with Composer and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp-cli

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dist-archive command
        run: |
          rm -f ~/.composer/auth.json ~/.config/composer/auth.json && unset COMPOSER_AUTH
          wp package install wp-cli/dist-archive-command:v3.1.0 --allow-root

      - name: Build distribution archive
        env:
          GIT_TAG: ${{ github.ref_name }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          MAIN_FILE: ${{ inputs.main_file }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            rm -f ~/.composer/auth.json ~/.config/composer/auth.json && unset COMPOSER_AUTH
            bash /tmp/embold-scripts/build.sh --fix
          else
            rm -f ~/.composer/auth.json ~/.config/composer/auth.json && unset COMPOSER_AUTH
            bash /tmp/embold-scripts/build.sh --dev
          fi

      - name: Assemble release metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          bash /tmp/embold-scripts/release-meta.sh
          echo "--- release notes ---"
          cat "$NOTES_FILE"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: ${{ steps.meta.outputs.generated == 'true' }}
          files: dist/archives/*
