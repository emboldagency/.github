name: WordPress Plugin Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Release tag (e.g., 1.0.0 or v1.0.0)'
      plugin_main_file:
        required: false
        type: string
        description: 'Main plugin file (defaults to <repo>.php if not set)'
      readme_file:
        required: false
        type: string
        default: readme.txt
        description: 'Readme file (default: readme.txt)'
      version_sync_mode:
        required: false
        type: string
        default: warn
        description: |
          Controls how version mismatches are handled:
            - 'error': only check and fail on mismatch
            - 'fix': automatically update version numbers in plugin files to match the tag
            - 'warn': print a warning on mismatch but do not fail
            - 'skip': skip the version check/fix step entirely
      tag_pattern:
        required: false
        type: string
        default: '[0-9]+\.[0-9]+\.[0-9]+'
        description: 'Regex pattern the tag must match to continue the release.'

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP with Composer and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache WP-CLI packages
        uses: actions/cache@v4
        with:
          path: ~/.wp-cli/packages
          key: ${{ runner.os }}-wpcli-packages-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-wpcli-packages-

      - name: Ensure tag matches pattern
        if: (github.ref_type == 'tag') || (inputs.tag != '')
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^${{ inputs.tag_pattern }}$ ]]; then
            echo "Tag '${{ inputs.tag }}' does not match required pattern: ^${{ inputs.tag_pattern }}$"
            exit 1
          fi

      - name: Check plugin versions match tag
        if: (github.ref_type == 'tag') || (inputs.tag != '')
        shell: bash
        env:
          PLUGIN_MAIN_FILE: ${{ inputs.plugin_main_file || format('{0}.php', github.event.repository.name) }}
          README_FILE: ${{ inputs.readme_file }}
          VERSION_SYNC_MODE: ${{ inputs.version_sync_mode || 'warn' }}
          TAG: ${{ inputs.tag }}
        run: |
          # Allow VERSION_SYNC_MODE=skip to skip this step entirely
          if [ "$VERSION_SYNC_MODE" = "skip" ]; then
            echo "Skipping version check/fix as requested (mode=skip)."
            exit 0
          fi

          # Skip on branch (only run on tags)
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            echo "Not running on a tag. Skipping sync-versions."
            exit 0
          fi

          PLUGIN_MAIN_FILE="${PLUGIN_MAIN_FILE:-${GITHUB_REPOSITORY##*/}.php}"
          README_FILE="${README_FILE:-readme.txt}"
          VERSION_SYNC_MODE="${VERSION_SYNC_MODE:-warn}"

          LATEST_TAG="$TAG"
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag --list --sort=-version:refname | head -n 1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            echo "Error: No tag provided and no local Git tags found. Please create a tag first (e.g., git tag 0.1.0)."
            exit 1
          fi

          CURRENT_PLUGIN_VERSION=$(grep -E -o "^ \* Version: *[0-9A-Za-z.-]+" "$PLUGIN_MAIN_FILE" | sed -E "s/^ \* Version: *//")
          if [ -z "$CURRENT_PLUGIN_VERSION" ]; then
              CURRENT_PLUGIN_VERSION=$(grep -E -o "Version: *[0-9A-Za-z.-]+" "$PLUGIN_MAIN_FILE" | head -n1 | sed -E "s/Version: *//")
          fi

          CURRENT_README_VERSION=$(grep -E -o "^Stable tag: *[0-9A-Za-z.-]+" "$README_FILE" | sed -E "s/^Stable tag: *//")

          if [ "$CURRENT_PLUGIN_VERSION" != "$LATEST_TAG" ] || [ "$CURRENT_README_VERSION" != "$LATEST_TAG" ]; then
            echo "Version mismatch detected!"
            echo "  Git tag: $LATEST_TAG"
            echo "  $PLUGIN_MAIN_FILE: $CURRENT_PLUGIN_VERSION"
            echo "  $README_FILE: $CURRENT_README_VERSION"
            if [ "$VERSION_SYNC_MODE" = "fix" ]; then
              echo "Fixing versions to match tag..."
              sed -i -E "s/(^ \* Version: *)[0-9A-ZaZ.-]+/\1$LATEST_TAG/" "$PLUGIN_MAIN_FILE"
              if ! grep -q "^ \* Version: *$LATEST_TAG" "$PLUGIN_MAIN_FILE"; then
                sed -i -E "s/(Version: *)[0-9A-ZaZ.-]+/\1$LATEST_TAG/" "$PLUGIN_MAIN_FILE"
              fi
              sed -i -E "s/(^Stable tag: *)[0-9A-ZaZ.-]+/\1$LATEST_TAG/" "$README_FILE"
              echo "Files updated. Please commit and re-tag as needed."
              exit 0
            elif [ "$VERSION_SYNC_MODE" = "warn" ]; then
              echo "::warning::Version numbers do not match the latest tag, but continuing as mode=warn."
              exit 0
            else
              echo "ERROR: Version numbers do not match the latest tag."
              exit 1
            fi
          else
            echo "Versions match the latest local tag '$LATEST_TAG'."
          fi

          exit 0

      - name: Install dist-archive command
        run: wp package install wp-cli/dist-archive-command:@stable

      - name: Build plugin
        if: hashFiles('composer.json') != ''
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Build distribution archive
        run: wp dist-archive . dist --create-target-dir

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ./dist/*
