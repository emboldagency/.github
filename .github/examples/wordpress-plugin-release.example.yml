name: WordPress Plugin Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]" # IMPORTANT: This should match the tag_pattern input below
  workflow_dispatch:
    inputs:
      tag:
        required: false
        type: string
        description: 'Release tag (e.g., 1.0.0 or v1.0.0)'
      version_sync_mode:
        required: false
        type: string
        default: error
        description: |
          Controls how version mismatches are handled:
            - 'fix': automatically update version numbers in plugin files to match the tag
            - 'error': only check and fail on mismatch (default)
            - 'skip': skip the version check/fix step entirely

jobs:
  wordpress-plugin-release:
    uses: emboldagency/.github/.github/workflows/wordpress-plugin-release.yml@v1
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      plugin_main_file: my-plugin.php # or omit to use the default <repo>.php
      readme_file: readme.txt # optional, default is readme.txt
      version_sync_mode: ${{ github.event.inputs.version_sync_mode }} # 'fix', 'error', or 'skip'
      tag_pattern: '[0-9]+\.[0-9]+\.[0-9]+' # IMPORTANT: This should match the on.push.tags pattern above
#
# Note: The version check/fix step will only run on tag events. If this workflow runs on a branch (e.g., via workflow_dispatch),
# the version check/update will be skipped and the workflow will continue without error.
#
# If version_sync_mode is 'fix', the workflow will update the version numbers in your plugin files to match the tag.
# If version_sync_mode is 'error', it will fail if they do not match.
# If version_sync_mode is 'skip', the version check/fix step will be skipped entirely.
