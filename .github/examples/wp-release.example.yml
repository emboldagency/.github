name: WordPress Plugin Release

on:
  # Every tag: the shared workflow reports one it won't release (e.g. v1.2.3)
  # instead of the run silently never happening.
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  dist:
    uses: emboldagency/.github/.github/workflows/wp-release.yml@master
    with:
      # Replace these with your actual plugin details:
      plugin_slug: 'your-plugin-slug'
      main_file: 'your-plugin-slug.php'
