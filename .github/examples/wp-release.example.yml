name: WordPress Plugin Release

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"
      - "v?[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

jobs:
  dist:
    uses: emboldagency/.github/.github/workflows/wp-release.yml@main
    with:
      # Replace these with your actual plugin details:
      plugin_slug: 'your-plugin-slug'
      main_file: 'your-plugin-slug.php'
